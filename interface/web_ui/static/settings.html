<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISHTI Settings</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #21262d; --text: #e6edf3;
    --muted: #8b949e; --accent: #58a6ff; --ok: #3fb950; --err: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { padding: 18px 28px; border-bottom: 1px solid var(--border);
           display: flex; align-items: baseline; gap: 14px; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--border);
           border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button.danger:hover { border-color: var(--err); color: var(--err); }
  main { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 61px); }
  nav { border-right: 1px solid var(--border); padding: 14px 0; }
  nav a { display: block; padding: 8px 20px; color: var(--muted); text-decoration: none;
          border-left: 2px solid transparent; font-size: 13px; }
  nav a.active { color: var(--text); border-left-color: var(--accent); background: var(--panel); }
  section { padding: 22px 30px; max-width: 860px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 15px; }
  .card .desc { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
  .field { display: grid; grid-template-columns: 260px 1fr; gap: 4px 16px;
           padding: 9px 0; border-top: 1px solid var(--border); align-items: center; }
  .field label { font-weight: 600; font-size: 13px; }
  .field .hint { grid-column: 1; color: var(--muted); font-size: 11.5px; }
  .field .ctl { grid-column: 2; grid-row: 1 / span 2; display: flex; align-items: center; gap: 8px; }
  input[type=text], input[type=number], input[type=password], select {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 9px; font-size: 13px; width: 100%; max-width: 380px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.err { color: var(--err); border-color: var(--err); }
  .pill.sel { color: var(--accent); border-color: var(--accent); }
  .arch { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
          cursor: pointer; transition: border-color .15s; }
  .arch:hover { border-color: var(--accent); }
  .arch.active { border-color: var(--accent); background: rgba(88,166,255,.06); }
  .arch h3 { margin: 0 0 3px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .arch p { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; }
  .arch .order { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--accent); }
  #toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; border-radius: 8px;
           background: var(--panel); border: 1px solid var(--ok); color: var(--ok);
           display: none; font-size: 13px; }
  #toast.error { border-color: var(--err); color: var(--err); }
  .row { display: flex; gap: 8px; margin-bottom: 14px; }
  textarea { width: 100%; min-height: 120px; background: var(--bg); color: var(--text);
             border: 1px solid var(--border); border-radius: 6px; font-family: ui-monospace, monospace;
             font-size: 12px; padding: 10px; }
</style>
</head>
<body>
<header>
  <h1>ISHTI Settings</h1><span class="sub">local · no cloud · every change is validated before it lands</span>
  <span class="spacer"></span>
  <button onclick="exportCfg()">Export</button>
  <button onclick="importCfg()">Import</button>
  <button class="danger" onclick="resetAll()">Reset all</button>
</header>
<main>
  <nav id="nav"></nav>
  <section id="content">Loading…</section>
</main>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
let SCHEMA = null, VALUES = null, CURRENT = null;

function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.className = err ? 'error' : '';
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3200);
}
async function jfetch(url, opts) {
  const r = await fetch(url, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}

async function init() {
  SCHEMA = await jfetch('/api/settings/schema');
  VALUES = await jfetch('/api/settings');
  renderNav();
  renderSection('architecture');
}

function renderNav() {
  $('#nav').innerHTML = SCHEMA.sections.map(s =>
    `<a href="#${s.id}" data-id="${s.id}">${s.title}</a>`).join('');
  document.querySelectorAll('nav a').forEach(a =>
    a.onclick = (e) => { e.preventDefault(); renderSection(a.dataset.id); });
}

function renderSection(id) {
  CURRENT = id;
  document.querySelectorAll('nav a').forEach(a =>
    a.classList.toggle('active', a.dataset.id === id));
  const sec = SCHEMA.sections.find(s => s.id === id);
  const val = VALUES[id] || {};
  let html = `<div class="card"><h2>${sec.title}</h2><p class="desc">${sec.description || ''}</p>`;
  if (id === 'architecture') html += archCards() + `<h2 style="margin-top:18px">Routing</h2>`;
  for (const f of sec.fields) {
    if (id === 'architecture' && f.name === 'active_profile') continue;
    html += fieldHtml(id, f, val[f.name]);
  }
  html += `</div>`;
  if (id === 'architecture') html += stateInspector();
  if (id === 'integrations' || id === 'skills') html += extraNote(id);
  $('#content').innerHTML = html;
  bindControls(id);
  if (id === 'architecture') loadArchHealth();
}

function fieldHtml(sec, f, v) {
  const secret = f.secret ? 'password' : 'text';
  let ctl;
  if (f.enum) {
    ctl = `<select data-sec="${sec}" data-name="${f.name}">` +
          f.enum.map(o => `<option value="${o}" ${o === v ? 'selected' : ''}>${o}</option>`).join('') + `</select>`;
  } else if (f.type === 'boolean') {
    ctl = `<input type="checkbox" data-sec="${sec}" data-name="${f.name}" ${v ? 'checked' : ''}>`;
  } else if (Array.isArray(v) || (f.type === 'array')) {
    ctl = `<textarea data-sec="${sec}" data-name="${f.name}" data-json="1">${JSON.stringify(v || [], null, 1)}</textarea>`;
  } else {
    ctl = `<input type="${secret}" data-sec="${sec}" data-name="${f.name}" value="${v ?? ''}">`;
  }
  return `<div class="field"><label>${f.name}</label><div class="ctl">${ctl}</div>
          <div class="hint">${f.description || ''}</div></div>`;
}

function bindControls(sec) {
  document.querySelectorAll('[data-sec]').forEach(el => {
    const ev = el.type === 'checkbox' ? 'change' : 'change';
    el.addEventListener(ev, async () => {
      let v;
      if (el.type === 'checkbox') v = el.checked;
      else if (el.dataset.json) { try { v = JSON.parse(el.value); } catch { return toast('Invalid JSON', true); } }
      else if (el.type === 'number' || el.tagName === 'SELECT' && !isNaN(Number(el.value)) && el.value !== '') v = Number(el.value) || el.value;
      else v = el.value;
      // numbers from schema
      if (el.tagName === 'INPUT' && el.type === 'number') v = Number(el.value);
      try {
        VALUES = await jfetch('/api/settings', {method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({[sec]: {[el.dataset.name]: v}})});
        toast('Saved');
      } catch (e) { toast(e.message, true); init2Keep(sec); }
    });
  });
}
async function init2Keep(sec) { SCHEMA = SCHEMA; VALUES = await jfetch('/api/settings'); renderSection(sec); }

// ---- Architecture tab -----------------------------------------------------------------
function archCards() {
  return `<div id="archList"><div class="desc">Loading profiles…</div></div>
          <div id="archHealth" class="desc" style="margin-bottom:12px"></div>`;
}
async function loadArchHealth() {
  try {
    const d = await jfetch('/api/arch/profiles');
    const list = document.getElementById('archList');
    list.innerHTML = d.profiles.map(p => `
      <div class="arch ${p.selected ? 'active' : ''}" data-id="${p.id}">
        <h3>${p.name} ${p.selected ? '<span class="pill sel">active</span>' : ''}
            <span class="pill" data-health="${p.id}">…</span></h3>
        <p>${p.description}</p>
        <div class="order">${p.order.join(' → ')}</div>
      </div>`).join('');
    const hh = document.getElementById('archHealth');
    hh.textContent = d.health.ok
      ? `Active profile healthy: ${d.health.checks.filter(c => c.ok).map(c => c.detail).join(' · ')}`
      : `Active profile health issues: ${d.health.checks.filter(c => !c.ok).map(c => `${c.dep}: ${c.detail}`).join('; ')}`;
    document.querySelectorAll('.arch').forEach(el => el.onclick = async () => {
      try {
        const res = await jfetch('/api/arch/profiles/switch', {method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({profile: el.dataset.id})});
        toast(`Switched to ${res.active}`); loadArchHealth();
      } catch (e) {
        try { const r = await (await fetch('/api/arch/profiles/switch', {method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({profile: el.dataset.id})})).json();
              toast(r.reason || e.message, true); }
        catch { toast(e.message, true); }
        loadArchHealth();
      }
    });
  } catch (e) { document.getElementById('archList').innerHTML = `<div class="desc">${e.message}</div>`; }
}

function stateInspector() {
  return `<div class="card" id="stateCard">
    <h2>Conversation state (this chat)</h2>
    <p class="desc">What the assistant currently believes the conversation is about — the fix for
       “it forgets what we were researching”. Changes every turn; survives architecture switches.</p>
    <div class="row"><input type="text" id="stateSid" placeholder="session id (empty = default)" style="max-width:280px">
    <button onclick="loadState()">Inspect</button></div>
    <pre id="stateOut" style="white-space:pre-wrap;color:var(--muted);font-size:12px"></pre>
  </div>`;
}
async function loadState() {
  const sid = document.getElementById('stateSid').value.trim();
  try {
    const d = await jfetch('/api/arch/state' + (sid ? `?session_id=${encodeURIComponent(sid)}` : ''));
    document.getElementById('stateOut').textContent =
      `ACTIVE TOPIC: ${d.active_topic || '(none)'}\nACTIVE TASK: ${d.active_task || '(none)'}\n` +
      `TASK STACK: ${(d.task_stack || []).join(' -> ') || '(empty)'}\nENTITIES: ${Object.keys(d.entities || {}).join(', ') || '(none)'}\n` +
      `CONSTRAINTS: ${JSON.stringify(d.constraints)}\nLAST SEARCH: ${(d.last_searches || []).slice(-1)[0]?.query || '(none)'}\n\n` +
      `PROMPT SUMMARY:\n${d.summary || '(empty)'}`;
  } catch (e) { document.getElementById('stateOut').textContent = e.message; }
}

// ---- export / import / reset -----------------------------------------------------------
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: 'application/json'}));
  a.download = name; a.click();
}
async function exportCfg() { download('ishti-settings.json', JSON.stringify(await jfetch('/api/settings/export'), null, 2)); }
async function importCfg() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = async () => {
    try {
      VALUES = await jfetch('/api/settings/import', {method: 'POST',
        headers: {'Content-Type': 'application/json'}, body: await inp.files[0].text()});
      toast('Imported'); renderSection(CURRENT);
    } catch (e) { toast(e.message, true); }
  };
  inp.click();
}
async function resetAll() {
  if (!confirm('Reset ALL settings to defaults?')) return;
  VALUES = await jfetch('/api/settings/reset', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
  toast('Reset to defaults'); renderSection(CURRENT);
}

init();
</script>
</body>
</html>
