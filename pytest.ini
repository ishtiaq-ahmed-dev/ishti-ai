[pytest]
testpaths = tests
norecursedirs = tests/skills tests/scenarios .qa_nemotron
# tests/skills/* are the per-skill QA suites (120 folders); they run through the harness
#   venv\Scripts\python tests\run_skill.py <skill|all>
# NOT in the default run: their module names collide with the curated suites and the full
# set takes far longer than the E4 offline pass.
python_files = test_*.py
addopts = -q -m "not e2e"
# Default run = everything OFFLINE (the E4 one-command suite).
# Live backend contract tests need Ollama + the GPU and start a real server; run them explicitly:
#   venv\Scripts\python -m pytest tests/test_lifecycle_contract.py -m e2e -s
markers =
    unit: fast offline unit tests
    integration: cross-module tests (mocked skills, scratch stores)
    e2e: needs live services (Ollama) — run explicitly
    slow: long-running
# E4: one command runs everything offline:
#   venv\Scripts\python -m pytest
# live end-to-end (needs Ollama running):
#   venv\Scripts\python -m ishti.check
