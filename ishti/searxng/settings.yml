# Local SearXNG for ISHTI's web search (open-source metasearch: Google, Brave, DuckDuckGo, Wikipedia, ...).
# docker run -d --name ishti-searxng --restart unless-stopped -p 127.0.0.1:8890:8080
#   -v <ISHTI folder>/ishti/searxng:/etc/searxng -e SEARXNG_SECRET=<random> searxng/searxng
use_default_settings: true
server:
  limiter: false        # only ISHTI on this PC talks to it (bound to 127.0.0.1)
  image_proxy: false
search:
  formats: [html, json]
  # Upstream engines throttle heavy use ("Suspended: too many requests"). Retry them after minutes, not the
  # default hour, and keep several engines on so one suspended engine never empties the results.
  suspended_times:
    SearxEngineAccessDenied: 600
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 300
    cf_SearxEngineCaptcha: 600
    cf_SearxEngineAccessDenied: 600
    recaptcha_SearxEngineCaptcha: 600
outgoing:
  request_timeout: 2.0     # answer from the engines that respond in 2 s; a slow one is dropped
engines:
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
  - name: yahoo
    disabled: false
  - name: bing
    disabled: false
  - name: qwant
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikinews
    disabled: false
